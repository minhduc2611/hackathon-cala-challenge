<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revealed Thesis · Cala Entity &amp; Bridge Map</title>
  <meta name="description" content="Explore verified Cala entities and documented relationships on a spacious map.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="Revealed Thesis home">
      <span class="brand-mark">R</span>
      <span>Revealed Thesis <small>Cala entity and bridge map</small></span>
    </a>
    <p id="mapStatus" class="status" aria-live="polite">Add entities to build a map</p>
  </header>

  <main class="map-workspace">
    <section class="map-toolbar" aria-label="Map entity adder">
      <form id="aiSearchForm" class="entity-adder" role="search">
        <label class="sr-only" for="aiSearchInput">Add entities to the map</label>
        <div class="token-input-shell">
          <div id="pendingEntityChips" class="pending-entity-chips" aria-live="polite"></div>
          <input id="aiSearchInput" type="search" autocomplete="off" placeholder="Add startups, companies, investors, funds or people (e.g. Nvidia, OpenAI, Sequoia)">
          <div id="searchSuggestPopup" class="search-results" role="listbox" hidden></div>
        </div>
        <button id="buildMapBtn" type="submit">Build map</button>
      </form>
      <p id="adderNotice" class="adder-notice">Add 1 to 4 entities above to build the map.</p>
    </section>

    <section id="constellationStage" class="constellation-stage" aria-label="Constellation map workspace">
      <div id="bridgeMapCanvas" class="bridge-map-canvas" tabindex="0" aria-label="Interactive entity relationship map">
        <div id="mapViewport" class="map-viewport">
          <svg id="constellationSvg" viewBox="0 0 3200 2400" width="3200" height="2400" aria-label="Verified relationship paths"></svg>
          <div id="constellationNodesLayer" class="constellation-nodes-layer"></div>
        </div>
        <div id="mapEmptyState" class="map-empty-state">
          <strong>Add 1 to 4 entities above to build the map.</strong>
          <span>Only Cala relationships with evidence are drawn.</span>
        </div>
        <div id="mapHoverTooltip" class="map-hover-tooltip" role="status" hidden></div>
        <div class="map-controls" aria-label="Map controls">
          <button id="mapZoomOut" type="button" aria-label="Zoom out">-</button>
          <button id="mapFit" type="button">Fit</button>
          <button id="mapZoomIn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>

      <aside id="exploredEntitiesBox" class="explored-entities-box" aria-label="Entities on this map">
        <div class="explored-heading">
          <span>On this map</span>
          <div class="explored-actions">
            <button id="filtersBtn" type="button" aria-expanded="false" aria-controls="mapFilterPanel">Filters</button>
            <button id="clearMapBtn" type="button" hidden>Clear</button>
          </div>
        </div>
        <div id="activeEntityChips" class="active-entity-chips"></div>
        <div id="mapFilterPanel" class="map-filter-panel" hidden>
          <label><input id="sharedOnlyFilter" type="checkbox"> Shared paths only</label>
          <label><input id="filingOnlyFilter" type="checkbox"> FILING only</label>
        </div>
      </aside>

      <aside id="groupDrilldown" class="group-drilldown" aria-label="Contribution group details" hidden></aside>
    </section>
  </main>

  <div id="entityDossierBackdrop" class="dossier-backdrop" hidden>
    <section id="entityDossierModal" class="entity-dossier-modal" role="dialog" aria-modal="true" aria-labelledby="dossierTitle" tabindex="-1">
      <header class="dossier-header">
        <div class="dossier-identity">
          <button id="dossierBackBtn" type="button" class="dossier-back" aria-label="Back to previous dossier" hidden>Back</button>
          <span id="dossierInitials" class="dossier-initials" aria-hidden="true">E</span>
          <div>
            <div class="dossier-name-row">
              <h1 id="dossierTitle">Entity</h1>
              <span id="dossierTypeBadge" class="type-badge">Entity</span>
            </div>
            <p id="dossierDescription" class="dossier-description">Not found in Cala</p>
            <p id="dossierMeta" class="dossier-meta">Not found in Cala</p>
          </div>
        </div>
        <div class="dossier-actions">
          <span id="dossierTier" class="source-tier">Not found in Cala</span>
          <button id="dossierShowMapBtn" type="button">Show on map</button>
          <button id="dossierCenterBtn" type="button">Make map center</button>
          <button id="dossierAddBtn" type="button" hidden>Add to map</button>
          <button id="dossierCloseBtn" type="button" aria-label="Close entity dossier">Close</button>
        </div>
      </header>
      <nav class="dossier-tabs" role="tablist" aria-label="Entity dossier sections">
        <button id="dossierTabOverview" type="button" class="dossier-tab is-active" role="tab" aria-selected="true" aria-controls="dossierBody" tabindex="0" data-dossier-tab="overview">Overview</button>
        <button id="dossierTabPeople" type="button" class="dossier-tab" role="tab" aria-selected="false" aria-controls="dossierBody" tabindex="-1" data-dossier-tab="people">People</button>
        <button id="dossierTabFunding" type="button" class="dossier-tab" role="tab" aria-selected="false" aria-controls="dossierBody" tabindex="-1" data-dossier-tab="funding">Funding &amp; Investors</button>
        <button id="dossierTabConnections" type="button" class="dossier-tab" role="tab" aria-selected="false" aria-controls="dossierBody" tabindex="-1" data-dossier-tab="connections">Connections</button>
        <button id="dossierTabTimeline" type="button" class="dossier-tab" role="tab" aria-selected="false" aria-controls="dossierBody" tabindex="-1" data-dossier-tab="timeline">Timeline</button>
        <button id="dossierTabSources" type="button" class="dossier-tab" role="tab" aria-selected="false" aria-controls="dossierBody" tabindex="-1" data-dossier-tab="sources">Sources &amp; Gaps</button>
      </nav>
      <div id="dossierBody" class="dossier-body" role="tabpanel" aria-labelledby="dossierTabOverview" tabindex="0" aria-live="polite"></div>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
